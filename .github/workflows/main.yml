name: HealthAI CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'DOCKER_SETUP.md'

permissions:
  id-token: write
  contents: read

jobs:
  integration:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Install Backend Dependencies
        run: |
          cd Backend
          uv venv
          source .venv/bin/activate
          uv pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        run: |
          cd Frontend
          npm ci

  build-and-push-ecr-image:
    name: Build and Push Docker Image
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.AWS_REPOSITORY_NAME }}
          IMAGE_TAG: latest
        run: |
          docker build --build-arg VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }} --build-arg VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }} -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

  continuous-deployment:
    name: Continuous Deployment
    needs: build-and-push-ecr-image
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull latest image
        run: |
          docker pull ${{ steps.login-ecr.outputs.registry }}/${{ secrets.AWS_REPOSITORY_NAME }}:latest

      - name: Stop and remove existing container
        run: |
          docker ps -q --filter "name=healthai" | grep -q . && docker stop healthai && docker rm -fv healthai || true

      - name: Run Docker container
        run: |
          docker run -d -p 8000:8000 -p 5173:5173 \
            --name=healthai \
            -e 'GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}' \
            -e 'HUGGINGFACE_API_KEY=${{ secrets.HUGGINGFACE_API_KEY }}' \
            -e 'SUPABASE_URL=${{ secrets.SUPABASE_URL }}' \
            -e 'SUPABASE_KEY=${{ secrets.SUPABASE_KEY }}' \
            -e 'LANGSMITH_API_KEY=${{ secrets.LANGSMITH_API_KEY }}' \
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.AWS_REPOSITORY_NAME }}:latest

      - name: Clean up old images
        run: |
          docker system prune -f
